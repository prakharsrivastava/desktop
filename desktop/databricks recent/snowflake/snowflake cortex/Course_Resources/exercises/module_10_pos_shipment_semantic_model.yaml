# ==========================================================
# Exercise 10.1 — Fix the Join Type in a POS/Shipment Semantic Model
# Course: 1018
# Module 10
# ==========================================================
#
# The category manager's NL-BI assistant sits on top of a semantic model
# joining pos_sales_daily to shipments. An INNER join between them silently
# drops every sale that has no same-day shipment row — which, in real
# CPG data, is most sales (shipments and point-of-sale scans rarely land on
# the exact same date). Cortex Analyst will confidently answer a
# sell-through question using that model and never flag that rows vanished.
#
# Your task:
# 1. Declare the relationship sales_to_shipment between pos_sales_daily
#    (left_table) and shipments (right_table).
# 2. Set join_type so a sale with NO matching shipment row is still kept
#    (the shipment-side columns become NULL instead of dropping the row).
# 3. Join on sku = sku and sale_date = ship_date.
# ==========================================================

# YOUR CODE:

name: cpg_sell_through_model
tables:
  - name: pos_sales_daily
    base_table: analytics.pos.pos_sales_daily
    dimensions:
      - name: sale_date
      - name: store_id
    facts:
      - name: units_sold
      - name: dollar_sales
  - name: shipments
    base_table: analytics.pos.shipments
    facts:
      - name: cases_shipped

relationships:
  - name: sales_to_shipment
    left_table: ___
    right_table: shipments
    join_type: ___
    relationship_columns:
      - { left_column: sku, right_column: sku }
      - { left_column: ___, right_column: ship_date }


