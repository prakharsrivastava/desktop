#
# Priya asked her Snowflake CoWork agent a plain sales-total question and it
# called Cortex Search (a document lookup) instead of Cortex Analyst. Root
# cause: Search's description said "answers questions about sales" — vague
# enough to overlap with Analyst's scope, so the agent guessed. A tool
# description is what the agent's routing scores against, so a sloppy one is
# the #1 cause of misrouting.
#
# Your task:
# 1. Write a tool description for cortex_search_returns_docs that is scoped to
#    UNSTRUCTURED text only (policies, tickets, notices) — narrow enough that
#    it can't be confused with a quantitative Analyst question.
# 2. Fill in NAME / TYPE / DESCRIPTION / EXAMPLE_QUESTIONS the same way the
#    course's cortex_analyst_sales_model example does.
# 3. Add a SCOPE BOUNDARY line stating what this tool does NOT answer, so it
#    can't collide with the sibling Analyst tool.
# ==========================================================

# YOUR CODE:

tool:
  name: ___
  type: ___
  description: >
    ___
  example_questions:
    - "___"
    - "___"
  scope_boundary: >
    Does NOT answer ___ — route those to cortex_analyst_sales_model instead.


