# Cortex Analyst answers natural-language questions by translating them into
# SQL against your semantic model — never against your raw tables directly.
# That means every fact, dimension, and synonym you declare MUST live INSIDE
# the block of the table it belongs to, not flattened at the top level. Get
# the nesting wrong and Cortex Analyst either can't find the column or,
# worse, guesses at a mapping that looks plausible and is wrong.
#
# Your task:
# 1. Declare two tables — fact_sales and dim_product — each with base_table
#    and primary_key.
# 2. Under fact_sales, nest a `facts:` list with one fact: net_sales
#    (expr: net_sales_amount, default_aggregation: sum).
# 3. Under dim_product, nest a `dimensions:` list with one dimension:
#    category (expr: category).
# 4. Add a `relationships:` block joining fact_sales to dim_product on
#    product_id.
# ==========================================================

